name: publish editor app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Create a GitHub release"
        type: boolean
        default: false

jobs:
  publish:
    name: build win-x64 + linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0"

      - name: Restore
        working-directory: UnchartedWaters/tools/gui
        run: dotnet restore UnchartedWaters.sln

      - name: Publish win-x64
        working-directory: UnchartedWaters/tools/gui
        run: |
          dotnet publish UnchartedWaters.Gui.csproj \
            -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none -o dist/win-x64

      - name: Publish linux-x64
        working-directory: UnchartedWaters/tools/gui
        run: |
          dotnet publish UnchartedWaters.Gui.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=none -o dist/linux-x64

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: uncharted-waters-editor
          path: |
            UnchartedWaters/tools/gui/dist/win-x64/**
            UnchartedWaters/tools/gui/dist/linux-x64/**

      - name: Attach to the GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            UnchartedWaters/tools/gui/dist/win-x64/**
            UnchartedWaters/tools/gui/dist/linux-x64/**
          fail_on_unmatched_files: true
